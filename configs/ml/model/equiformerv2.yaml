defaults:
  - default

net:
  _target_: mldft.ml.models.components.equiformerv2_components.equiformerv2_net.EquiformerV2Net
  use_pbc: False # Whether to use periodic boundary conditions.
  otf_graph: True # If this is True, the graph is generated on-the-fly.
  max_neighbors: 20
  max_radius: 12.0
  max_num_elements: 90

  num_layers: 8
  num_delta_layers: 4
  sphere_channels: 64
  attn_hidden_channels: 64 # [64, 96] This determines the hidden size of message passing. Do not necessarily use 96.
  num_heads: 8
  attn_alpha_channels: 64 # Not used when `use_s2_act_attn` is True.
  attn_value_channels: 16
  ffn_hidden_channels: 128
  norm_type: "layer_norm_sh" # ['rms_norm_sh', 'layer_norm', 'layer_norm_sh']

  lmax_list: [5]
  mmax_list: [5] #[2]
  grid_resolution: 18 # [18, 16, 14, None] For `None`, simply comment this line.

  num_sphere_samples: 128

  edge_channels: 128
  use_atom_edge_embedding: True
  share_atom_edge_embedding: False # If `True`, `use_atom_edge_embedding` must be `True` and the atom edge embedding will be shared across all blocks.
  distance_function: "gaussian"
  num_distance_basis: 600

  attn_activation: "silu"
  use_s2_act_attn: False # [False, True] Switch between attention after S2 activation or the original EquiformerV1 attention.
  use_attn_renorm: True # Attention re-normalization. Used for ablation study.
  ffn_activation: "silu" # ['silu', 'swiglu']
  use_gate_act: False # [True, False] Switch between gate activation and S2 activation
  use_grid_mlp: True # [False, True] If `True`, use projecting to grids and performing MLPs for FFNs.
  use_sep_s2_act: True # Separable S2 activation. Used for ablation study.

  alpha_drop: 0.0 #0.1 # [0.0, 0.1]
  drop_path_rate: 0.0 #0.05 # [0.0, 0.05]
  proj_drop: 0.0

  weight_init: "uniform" # ['uniform', 'normal']

  # density embedding
  density_embedding:
    _target_: mldft.ml.models.components.equiformerv2_components.density_embedding.DensityEmbedding
    density_embedding_lmax_list: ${model.net.lmax_list}
    n_channels: ${model.net.sphere_channels}
    basis_info: ${data.basis_info}
    apply_pyscf_to_e3nn_conversion: false

  # Atom Ref Module
  atom_ref_module:
    _target_: mldft.ml.models.components.atom_ref.AtomRef.from_dataset_statistics
    dataset_statistics: ${data.dataset_statistics}
    basis_info: ${data.basis_info}
    weigher_key: "has_energy_label"
    mode: scalar_only

  # Initial Guess Module
  initial_guess_delta_module:
    _target_: mldft.ml.models.components.equiformerv2_components.initial_guess_delta_module.InitialGuessDelta
    density_embedding_lmax_list: ${model.net.lmax_list}
    n_channels: ${model.net.sphere_channels}
    basis_info: ${data.basis_info}
    dataset_statistics: ${data.dataset_statistics}
    weigher_key: "constant"

  # Feature-wise rescaling module
  feature_wise_rescaling_module:
    _target_: mldft.ml.models.components.dimension_wise_rescaling.DimensionWiseRescaling.from_dataset_statistics
    dataset_statistics: ${data.dataset_statistics}
    basis_info: ${data.basis_info}
    weigher_key: "has_energy_label"
    s_coeff: 50
    s_grad: 0.05
    epsilon: 1e-8
    equivariant: True
