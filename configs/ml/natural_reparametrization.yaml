# @package _global_

# specify here default configuration
# order of defaults determines the order in which configs override each other
defaults:
  - data: md17subset
  - paths: default
  - extras: default
  - hydra: default
  #config for hyperparameter optimization

  - hparams_search: null
  # optional local config for machine/user specific settings

  # it's optional since it doesn't need to exist and is excluded from version control
  - optional local: default

  # apply settings in here last, overriding e.g. transforms
  - _self_

natural_reparametrization:
  dict_path: ${oc.env:DFT_DATA}/${data.dataset_name}/basis_transformations/${scope}_${orthogonalization}_natural_reparametrization_transformation_dict.zarr.zip

# additional path to save the transformation dictionary at, by default it is saved at the location
# from where it would be loaded using the current config
extra_save_path: ${natural_reparametrization.dict_path}
overwrite: true
scope: shellwise # or atomwise. The scope here is only used for the calculation of transformation dictionaries while the orthogonalization will also be used in the basis transforms.
orthogonalization: symmetric # or canonical

# task name, determines output directory path
task_name: "natural reparametrization"

# run name, determines suffix of output directory path
name: ""

# tags to help you identify your experiments
# you can overwrite this in experiment configs
# overwrite from command line with `python train.py tags="[first_tag, second_tag]"`
tags: ["dev"]

# seed for random number generators in pytorch, numpy and python.random
seed: null
