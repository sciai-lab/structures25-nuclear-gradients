# @package _global_

# default debugging setup, other debugging configs can inherit from this one
# Use this config when you want to test your default training setup,
# but want to save logs in a separate debug folder and disable checkpointing.

# overwrite task name so debugging logs are stored in separate folder
task_name: "debug"

# disable callbacks and loggers during debugging
callbacks: null
logger: null

extras:
  ignore_warnings: False
  enforce_tags: False

# sets level of all command line loggers to 'DEBUG'
# https://hydra.cc/docs/tutorials/basic/running_your_app/logging/
hydra:
  job_logging:
    root:
      level: DEBUG

  # use this to also set hydra loggers to 'DEBUG'
  # verbose: True

trainer:
  detect_anomaly: true # raise exception if NaN or +/-inf is detected in any tensor
  enable_checkpointing: false

model:
  metric_interval: 1
  loss_log_interval: 1
