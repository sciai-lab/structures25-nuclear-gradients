_target_: mldft.ml.data.datamodule.OFDataModule
transforms: ${data.transforms}
split_file:
  _target_: mldft.utils.dynamic_splitfiles.construct_splitfile
  split_files: ${oc.env:DFT_DATA}/${data.dataset_name}/split.pkl
  output_file: ${paths.output_dir}/split.pkl
data_dir: ${oc.env:DFT_DATA}
basis_info: ${data.basis_info}
# Dataloader settings
batch_size: 128
num_workers: 8
pin_memory: false
shuffle_train: true
shuffle_val: false
shuffle_test: false
do_denop_val: ${denop_val}
denop_val_select: "seeded_random" # options: "last", "seeded_random"
n_denop_mols: 10
requires_grid: ${requires_grid:${data.target_key},${denop_settings.negative_integrated_density_penalty_weight}}
grid_level: ${denop_settings.grid_level}
grid_prune: ${denop_settings.grid_prune}
# Dataset settings
dataset_kwargs:
  add_irreps: true # required for local frames
  cache_in_memory: false # disable caching by default; for small datasets, it should be turned on.
  energy_key: e_${data.target_key} # current options: e_kin, e_kin_minus_apbe, e_kin_plus_xc, e_tot
  gradient_key: grad_${data.target_key} # current options: grad_kin, grad_kin_minus_apbe, grad_kin_plus_xc, grad_tot
  limit_scf_iterations: 1 # filter out certain SCF iterations, see the docstring of `OFDataset`
  keep_initial_guess: false # whether to keep the first iteration regardless of `limit_scf_iterations`
  load_nuclear_gradients: false # whether to load nuclear gradient labels
  nuclear_gradient_outlier_threshold: null # skip nuclear gradient labels if any contracted transform row norm exceeds this threshold
  hdf5_manifest_path: ${data.dataset_name}/{label_subdir}_h5_${data.target_key}${mux:${.load_nuclear_gradients},_nuc_grad,''}/manifest.json # if missing, datamodule falls back to zarr labels
  denop_hdf5_manifest_path: ${data.dataset_name}/labels_denop_h5_${data.target_key}/manifest.json
  hdf5_max_open_shards: 256 # max open HDF5 shard files per worker; null keeps all lazily opened handles
  label_path: false # only used for HDF5 shards
  kohn_sham_path: false # only used for HDF5 shards
  ground_state_coeffs: false # only used for HDF5 shards

dataloader_kwargs:
  follow_batch: ["coeffs", "atomic_numbers"]
  list_keys: ["overlap_matrix", "transform_grad_contracted"] # , "coulomb_matrix", "aos"] # we put these as default, if they are not in the sample nothing happens
