# Slurm-safe callbacks: no interactive progress bar, but keep coarse epoch logging.
defaults:
  - learning_rate_monitor
  - model_checkpoint
  #  - early_stopping
  - model_summary
  - slurm_epoch_logging
  - print_overrides
  - matplotlib_figures
  - mesh_logging
  - custom_scalars
  #  - log_gradient_norm
  - _self_

interval: 1000

model_summary:
  max_depth: -1
