# @package _global_

defaults:
  - override /data: qm9
  - override /model: graphformer
  - override /trainer: default

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["md17", "xc", "mofdft_model"]

data:
  target_key: "kin_plus_xc"

trainer:
  max_epochs: 700

model:
  net:
    initial_guess_module:
      dataset_statistics: null

  loss_function:
    energy_loss:
      weight: 1.0
    gradient_loss:
      weight: 0.12
    coefficient_loss:
      weight: 0.05
