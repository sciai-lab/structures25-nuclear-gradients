# @package _global_

# the "basis trafo" in the name refers to the fact that the data module uses a basis transformation on the fly to compute local frames that fit even if chosen randomly for small molecules

defaults:
  - str25/default
  - override /data: qmugs_bin0_qm9_perturbed_fock
  - override /model: graphformer_cutoff_hierarc_energies_tf
  - override /data/transforms: dynamic_local_frames_global_natrep_cutoff

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["qm9_perturbed_fock", "kin_plus_xc", "graphformer"]

model:
  net:
    gnn_module:
      n_layers: 8
    energy_mlp:
      n_mlps: 4
