# For QM9 STRUCTURES25 model:
_target_: mldft.ofdft.scheduler.AdaptiveSigmoidSchedulerWithDecay
_partial_: true
min_lr: ${density_optimizer.lr}
max_lr: ${multiply:${density_optimizer.scheduler.min_lr}, 3}
offset: 3.5
slope: 1
decay_rate: 0.995
min_lr_decay: ${density_optimizer.scheduler.min_lr}
