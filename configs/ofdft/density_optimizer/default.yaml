# stop the optimization when the gradient norm is smaller than this value
convergence_tolerance: 1e-4

max_cycle: 10000

# Regularization / projection diagnostics (shared across all density optimizers)
reg_epsilon: null
reg_gamma: null
hard_projection: false
eigenvalue_threshold: null
quantile_threshold: null
orthogonal_projection: true
ks_basis: ${denop_settings.ks_basis}
overlap_tensor_block_target_bytes: 1000000000

# Debug option: if false, still compute reg-mat diagnostics but step with
# the unregularized projected gradient.
apply_reg_mat_to_step: true
