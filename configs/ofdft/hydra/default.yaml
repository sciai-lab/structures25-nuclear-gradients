# https://hydra.cc/docs/configure_hydra/intro/

# enable color logging
defaults:
  - override hydra_logging: colorlog
  - override job_logging: colorlog

# output directory, run_path is ofdft run dir if continue denop else generated dynamically on each
# if we continue a run, we do not increment the dir_counter
run:
  dir: ${mux:${continue_denop},${denop_dir},${base_dir}/${dir_counter:${base_dir},3,${continue_denop}}_${smart_override_dirname:${hydra.job.override_dirname},run_path}}

# hydra subdirectory usually named ".hydra". We name it differently for continued density optimization
# as to not overwrite the original ".hydra/config.yaml" from which we retrieve the settings
output_subdir: ${mux:${continue_denop},.hydra_ctd,.hydra}
sweep:
  dir: ${oc.env:MODELS}/${task_name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
  subdir: ${hydra.job.num}

job_logging:
  handlers:
    file:
      # Incorporates fix from https://github.com/facebookresearch/hydra/pull/2242
      # Set the log file path conditionally based on the value of continue_denop
      filename: ${hydra.runtime.output_dir}/${task_name}.log

callbacks:
  git_logging:
    _target_: mldft.utils.log_utils.hydra_callbacks.GitInfo
